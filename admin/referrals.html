<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refer & Earn</title><style>body{font-family:Arial;background:#f4f7fb;margin:0;color:#172033}main{max-width:1100px;margin:auto;padding:24px}.card{background:white;padding:20px;border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}button{background:#b42318;color:#fff;border:0;border-radius:7px;padding:8px;cursor:pointer}</style></head><body><main><section class="card"><h1>Refer & Earn</h1><p>रुपये का reward तभी Successful होगा जब referred student अपना पहला exam submit करेगा।</p><table><thead><tr><th>Referrer</th><th>New Student</th><th>Status</th><th>Money Reward</th><th>Action</th></tr></thead><tbody id="list"></tbody></table></section></main><script>const e=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function api(u,o){const r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){const a=await api('/api/admin/referrals');list.innerHTML=a.length?a.map(x=>`<tr><td>${e(x.referrerName)}<br>${e(x.referrerMobile)}</td><td>${e(x.referredName)}<br>${e(x.referredMobile)}</td><td>${e(x.status)}</td><td>₹${Number(x.rewardAmount||0).toFixed(2)}</td><td><button onclick="del(${x.id})">Delete</button></td></tr>`).join(''):'<tr><td colspan="5">No referral records.</td></tr>'}async function del(id){if(confirm('Remove this referral record?')){await api('/api/admin/referrals/'+id,{method:'DELETE'});load()}}load();</script></body></html>
