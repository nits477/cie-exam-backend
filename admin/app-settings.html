<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Settings</title><style>body{font-family:Arial;background:#f4f7fb;margin:0;color:#172033}main{max-width:800px;margin:auto;padding:24px}.card{background:#fff;padding:22px;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:bold}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #ccd6e3;border-radius:8px}button{background:#1769e0;color:white;border:0;border-radius:8px;padding:11px 18px;font-weight:bold}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="card"><h1>App Update & Referral Settings</h1><div class="grid"><label>Latest Version<input id="latestVersion"></label><label>Minimum Version<input id="minimumVersion"></label></div><label>Update Message<textarea id="updateMessage"></textarea></label><label>APK / Update URL<input id="updateUrl"></label><p><label><input id="updateEnabled" type="checkbox" style="width:auto"> Show update message</label> &nbsp; <label><input id="forceUpdate" type="checkbox" style="width:auto"> Force update</label></p><hr><p><label><input id="referralEnabled" type="checkbox" style="width:auto"> Refer & Earn enabled</label></p><label>Money Reward ₹<input id="referralRewardAmount" type="number" min="0" step="0.01"></label><p><button id="save">Save Settings</button> <span id="msg"></span></p></section></main><script>const ids=['latestVersion','minimumVersion','updateMessage','updateUrl','updateEnabled','forceUpdate','referralEnabled','referralRewardAmount'];async function api(u,o){const r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){const x=await api('/api/admin/app-config');ids.forEach(k=>{const el=document.getElementById(k);if(el.type==='checkbox')el.checked=!!x[k];else el.value=x[k]??''})}save.onclick=async()=>{const b={};ids.forEach(k=>{const el=document.getElementById(k);b[k]=el.type==='checkbox'?el.checked:el.value});try{await api('/api/admin/app-config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});msg.textContent='Saved successfully.'}catch(e){msg.textContent=e.message}};load();</script></body></html>
