<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Wallets</title><style>body{font-family:Arial;background:#f4f7fb;margin:0;color:#172033}main{max-width:1100px;margin:auto;padding:24px}.card{background:white;padding:20px;margin:15px 0;border-radius:14px;box-shadow:0 5px 18px #18345b10}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}input,select{padding:10px;border:1px solid #ccd6e3;border-radius:8px;width:100%;box-sizing:border-box}button{padding:10px 15px;background:#1769e0;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.danger{background:#b42318}.student,.tx{border-bottom:1px solid #e4e9f1;padding:12px 4px}.bad{color:#b42318}.muted{color:#64748b}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="card"><h1>Student Wallets</h1><p>Wallet में केवल रुपये का balance रहेगा। Refer & Earn reward भी रुपये में जोड़ा जाएगा।</p><div class="grid"><select id="student"></select><select id="action"><option>Added</option><option>Used</option><option>Refund</option></select><input id="amount" type="number" min="0.01" step="0.01" placeholder="₹ Amount"></div><p><input id="reason" placeholder="Reason (required)"><button id="save">Update Wallet</button></p><p id="msg"></p></section><section class="card"><h2>All Students</h2><input id="search" placeholder="Search name or mobile"><div id="list"></div></section><section class="card"><h2>Wallet History</h2><div id="history"></div></section></main><script>const $=x=>document.getElementById(x);let data=[];const e=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function api(u,o){const r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function draw(){const q=search.value.toLowerCase();list.innerHTML=data.filter(x=>(x.name+' '+x.mobile).toLowerCase().includes(q)).map(x=>`<div class="student"><b>${e(x.name)}</b> • ${e(x.mobile)} — Wallet ₹${Number(x.walletAmount||0).toFixed(2)} • Referral ${e(x.referralCode||'')}</div>`).join('')}async function load(){data=await api('/api/admin/wallets');student.innerHTML=data.map(x=>`<option value="${x.id}">${e(x.name)} • ${e(x.mobile)}</option>`).join('');draw();const tx=await api('/api/admin/wallet-transactions');history.innerHTML=tx.length?tx.map(x=>`<div class="tx"><b>${e(x.name)}</b> • ${e(x.mobile)} — ${e(x.action)} ₹${Number(x.amount||0).toFixed(2)}<br><span class="muted">${e(x.reason||'')}</span> <button class="danger" onclick="delTx(${x.id})">Delete</button></div>`).join(''):'<p>No wallet transactions.</p>'}save.onclick=async()=>{try{await api('/api/admin/wallets/'+student.value+'/adjust',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:action.value,amount:amount.value,reason:reason.value})});msg.textContent='Wallet updated.';amount.value=reason.value='';load()}catch(x){msg.className='bad';msg.textContent=x.message}};async function delTx(id){if(confirm('Delete this wallet history entry?')){await api('/api/admin/wallet-transactions/'+id,{method:'DELETE'});load()}}search.oninput=draw;load();</script></body></html>
