<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exams - CIE Admin</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#172033}header{background:#123b72;color:#fff;padding:16px 22px;position:sticky;top:0;z-index:20}.top{max-width:1220px;margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.brand h1{font-size:22px;margin:0}.brand small{opacity:.85}.nav{max-width:1220px;margin:0 auto;padding:10px 20px;background:#fff;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e4e9f1}.nav a{padding:9px 12px;border-radius:8px;text-decoration:none;color:#123b72;font-weight:bold}.nav a:hover,.nav a.active{background:#e8f0ff}main{max-width:1220px;margin:auto;padding:20px}.card{background:#fff;padding:20px;margin:18px 0;border-radius:12px;box-shadow:0 2px 10px #0000000d}button{background:#1769e0;color:#fff;border:0;padding:10px 14px;border-radius:7px;margin:4px 6px 4px 0;cursor:pointer}button.secondary{background:#506176}button.warn{background:#b54708}button.danger{background:#b42318}input,select{padding:8px;margin:4px 8px 4px 0;border:1px solid #ccd4df;border-radius:7px;box-sizing:border-box}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:14px}th{background:#f8fafc}.bad{color:#b42318}.ok{color:green}.note{font-size:13px;color:#586174}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f0ff;color:#123b72;font-weight:bold}.scroll{overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.tile{display:block;background:#fff;padding:22px;border-radius:14px;box-shadow:0 2px 10px #0001;text-decoration:none;color:#172033}.tile b{display:block;color:#123b72;font-size:18px;margin-bottom:7px}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:8px}.formgrid label{font-size:13px;font-weight:bold}.formgrid label span{display:block;margin-bottom:3px}.formgrid input,.formgrid select{width:100%;margin:0}.filters{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.filters label span{display:block;font-size:13px;font-weight:bold}@media(max-width:850px){.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.formgrid{grid-template-columns:1fr}.nav{overflow:auto;flex-wrap:nowrap}}</style></head><body><header><div class="top"><div class="brand"><h1>CIE Exam — Admin Portal V3.8.1</h1><small>Exams</small></div><div><button id="changePasswordBtn" class="secondary">Change Password</button><button id="logoutBtn" class="danger">Logout</button></div></div></header><nav class="nav"><a class="" href="/admin">Dashboard</a><a class="active" href="/admin/exams">Exams</a><a class="" href="/admin/results">Results</a><a class="" href="/admin/students">Students</a><a class="" href="/admin/pin-reset">PIN Reset</a><a class="" href="/admin/promotions">Promotions</a><a class="" href="/admin/media">App & Thumbnails</a></nav><main><div class="card"><h2>Create / Edit Exam</h2><div class="formgrid"><label><span>Exam Name</span><input id="examName"></label><label><span>Start Date & Time</span><input id="startAt" type="datetime-local"></label><label><span>End Date & Time</span><input id="endAt" type="datetime-local"></label><label><span>Timer Mode</span><select id="timerMode"><option value="none">No Timer</option><option value="whole">Whole Paper Timer</option><option value="per_question">Per Question Timer</option><option value="both">Both Timers</option></select></label><label><span>Whole Paper Minutes</span><input id="durationMinutes" type="number" value="0"></label><label><span>Seconds / Question</span><input id="perQuestionSeconds" type="number" value="0"></label><label><span>Questions to Give (0=all)</span><input id="questionLimit" type="number" value="0"></label><label><span>Passing %</span><input id="passingPercentage" type="number" value="40"></label><label><span>Attempt Limit (0=unlimited)</span><input id="attemptLimit" type="number" value="0"></label><label><span>Negative Marking</span><select id="negativeMarking"><option value="false">OFF</option><option value="true">ON</option></select></label><label><span>Wrong Answer Deduction</span><input id="negativeMarkValue" type="number" min="0" max="10" step="0.01" value="0" placeholder="e.g. 0.25"></label><label><span>Random Questions</span><select id="randomQuestions"><option value="false">No</option><option value="true">Yes</option></select></label><label><span>Live on Save</span><select id="active"><option value="true">Yes (Live)</option><option value="false">No (Closed)</option></select></label></div><input type="hidden" id="editId"><button id="save">Save Exam</button><button class="secondary" id="clear">Clear Form</button><div id="msg"></div></div><div class="card"><h2>All Exams</h2><button id="refresh">Refresh</button><div id="list" class="scroll"></div></div><div class="card"><h2>Questions</h2><p class="note">Question Bank isi Exams section ke andar hai. Excel columns: Question | Option A | Option B | Option C | Option D | Answer | Time Seconds (optional)</p><label>Select Exam <select id="uploadExam"></select></label><label>Hindi Text Format <select id="inputMode"><option value="auto">Auto Detect (Recommended)</option><option value="unicode">Unicode / Devanagari</option><option value="krutidev">Kruti Dev 010</option></select></label><input id="file" type="file" accept=".xlsx,.xls"><button id="upload">Upload & Import Excel</button><button class="warn" id="clearQ">Clear Selected Exam Questions</button><div id="qmsg"></div><div id="questionSets" style="margin-top:14px"></div><hr style="border:0;border-top:1px solid #e4e9f1;margin:20px 0"><label>View Question Bank <select id="questionExam"></select></label><button id="showQ">Show Questions</button><div id="questions" class="scroll"></div></div></main><script>const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){if(!v)return'';try{return new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return v}}async function jf(url,opt){const r=await fetch(url,opt),j=await r.json().catch(()=>({error:'Invalid server response'}));if(r.status===401){location.href='/admin';throw new Error('Admin session expired.')}if(!r.ok)throw new Error(j.error||'Request failed');return j}async function logout(){try{await jf('/api/admin/auth/logout',{method:'POST'})}catch{}location.href='/admin'}async function changePwd(){const oldPassword=prompt('Enter current Admin password:');if(oldPassword===null)return;const newPassword=prompt('Enter NEW password (minimum 8 characters):');if(newPassword===null)return;try{const j=await jf('/api/admin/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({oldPassword,newPassword})});alert(j.message||'Password changed.')}catch(e){alert(e.message)}}window.addEventListener('DOMContentLoaded',()=>{document.getElementById('logoutBtn')?.addEventListener('click',logout);document.getElementById('changePasswordBtn')?.addEventListener('click',changePwd)});let exams=[];function localInput(v){if(!v)return'';const d=new Date(v),z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,16)}function clear(){['editId','examName','startAt','endAt'].forEach(x=>$(x).value='');$('timerMode').value='none';$('durationMinutes').value=0;$('perQuestionSeconds').value=0;$('questionLimit').value=0;$('passingPercentage').value=40;$('attemptLimit').value=0;$('negativeMarking').value='false';$('negativeMarkValue').value=0;$('randomQuestions').value='false';$('active').value='true';$('save').textContent='Save Exam'}function body(){return{name:$('examName').value.trim(),startAt:$('startAt').value?new Date($('startAt').value).toISOString():null,endAt:$('endAt').value?new Date($('endAt').value).toISOString():null,timerMode:$('timerMode').value,durationMinutes:+$('durationMinutes').value||0,perQuestionSeconds:+$('perQuestionSeconds').value||0,questionLimit:+$('questionLimit').value||0,passingPercentage:+$('passingPercentage').value||40,attemptLimit:+$('attemptLimit').value||0,negativeMarkValue:$('negativeMarking').value==='true'?(+$('negativeMarkValue').value||0):0,randomQuestions:$('randomQuestions').value==='true',active:$('active').value==='true'}}async function load(){try{exams=await jf('/api/admin/exams');$('list').innerHTML='<table><tr><th>Name</th><th>Status</th><th>Live Control</th><th>Questions</th><th>Results</th><th>Attempts</th><th>Negative</th><th>Action</th></tr>'+exams.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.status)}</td><td>${x.active?'<span class="pill" style="background:#e8f7ef;color:#16794b">LIVE ON</span>':'<span class="pill" style="background:#eef1f5;color:#596579">CLOSED</span>'}<br><button class="${x.active?'warn':''}" onclick="toggleLive(${x.id},${!x.active})">${x.active?'Close Exam':'Go Live'}</button></td><td>${x.questionCount||0}</td><td>${x.resultCount||0}</td><td>${x.attemptLimit||0}</td><td>${(+x.negativeMarkValue||0)>0?('-'+x.negativeMarkValue):'OFF'}</td><td><button onclick="editExam(${x.id})">Edit</button><button class="danger" onclick="delExam(${x.id})">Delete</button></td></tr>`).join('')+'</table>'}catch(e){$('list').innerHTML='<p class=bad>'+esc(e.message)+'</p>'}}function editExam(id){const e=exams.find(x=>x.id==id);if(!e)return;$('editId').value=e.id;$('examName').value=e.name;$('startAt').value=localInput(e.startAt);$('endAt').value=localInput(e.endAt);$('timerMode').value=e.timerMode;$('durationMinutes').value=e.durationMinutes;$('perQuestionSeconds').value=e.perQuestionSeconds;$('questionLimit').value=e.questionLimit;$('passingPercentage').value=e.passingPercentage;$('attemptLimit').value=e.attemptLimit;$('negativeMarking').value=String((+e.negativeMarkValue||0)>0);$('negativeMarkValue').value=+e.negativeMarkValue||0;$('randomQuestions').value=String(!!e.randomQuestions);$('active').value=String(!!e.active);$('save').textContent='Update Exam';scrollTo({top:0,behavior:'smooth'})}async function save(){try{const id=$('editId').value;await jf(id?'/api/admin/exams/'+id:'/api/admin/exams',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body())});$('msg').innerHTML='<p class=ok>Exam saved successfully.</p>';clear();load()}catch(e){$('msg').innerHTML='<p class=bad>'+esc(e.message)+'</p>'}}async function toggleLive(id,active){const action=active?'LIVE':'CLOSE';if(!confirm(active?'Is exam ko LIVE karna hai? Students ko exam available ho jayega (schedule rules apply).':'Is exam ko CLOSE karna hai? Students exam start nahi kar payenge.'))return;try{const j=await jf('/api/admin/exams/'+id+'/live',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active})});alert(j.message);load()}catch(e){alert(e.message)}}
async function delExam(id){if(!confirm('Delete this exam?'))return;try{await jf('/api/admin/exams/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}window.addEventListener('DOMContentLoaded',()=>{$('save').onclick=save;$('clear').onclick=clear;$('refresh').onclick=load;load()});async function loadQuestionExams(){const a=await jf('/api/admin/exams');const o=a.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('uploadExam').innerHTML=o;$('questionExam').innerHTML=o;if(a.length)loadQ()}async function loadQuestionSets(){const examId=$('uploadExam').value;if(!examId){$('questionSets').innerHTML='';return}try{const sets=await jf('/api/admin/question-sets?examId='+encodeURIComponent(examId));$('questionSets').innerHTML=sets.length?'<h3 style="margin:14px 0 8px">Uploaded Excel Question Sets</h3><table><tr><th>Set / Excel File</th><th>Questions</th><th>Uploaded</th><th>Action</th></tr>'+sets.map(x=>`<tr><td>${esc(x.batchName||'Imported Question Set')}</td><td>${x.questionCount||0}</td><td>${fmt(x.uploadedAt)}</td><td><button class="danger" onclick="deleteQuestionSet('${esc(x.batchId)}')">Delete Excel</button></td></tr>`).join('')+'</table>':'<p class="note">No uploaded Excel question sets yet.</p>'}catch(e){$('questionSets').innerHTML='<p class=bad>'+esc(e.message)+'</p>'}}
async function deleteQuestionSet(batchId){const examId=$('uploadExam').value;if(!examId||!batchId||!confirm('Sirf is Question Set ke saare questions permanently delete karne hain? Baaki sets safe rahenge.'))return;try{const j=await jf('/api/admin/question-sets/'+encodeURIComponent(batchId)+'?examId='+encodeURIComponent(examId),{method:'DELETE'});$('qmsg').innerHTML='<p class=ok>Question Set deleted. '+(j.deleted||0)+' questions removed.</p>';$('questionExam').value=examId;await loadQuestionSets();await loadQ();load()}catch(e){alert(e.message)}}
async function uploadQuestions(){const f=$('file').files[0],examId=$('uploadExam').value;if(!examId||!f)return alert('Select Exam and Excel file');const fd=new FormData();fd.append('examId',examId);fd.append('inputMode',$('inputMode').value);fd.append('file',f);try{const r=await fetch('/api/admin/upload-excel',{method:'POST',body:fd});const j=await r.json();if(r.status===401){location.href='/admin';return}if(!r.ok)throw new Error(j.error||'Upload failed');$('qmsg').innerHTML=`<p class=ok>Found ${j.found}, Imported ${j.imported}${j.convertedRows?`, Kruti Dev converted: ${j.convertedRows}`:''}<br>Question Set: ${esc(j.batchName||f.name)}</p>`+(j.errors?.length?'<p class=bad>'+j.errors.map(esc).join('<br>')+'</p>':'');$('questionExam').value=examId;await loadQuestionSets();loadQ();load()}catch(e){$('qmsg').innerHTML='<p class=bad>'+esc(e.message)+'</p>'}}
async function clearQuestions(){const examId=$('uploadExam').value;if(!examId||!confirm('Selected exam ke SAARE question sets aur saare questions permanently delete karne hain?'))return;try{await jf('/api/admin/clear-questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({examId})});$('questionExam').value=examId;await loadQuestionSets();loadQ();load()}catch(e){alert(e.message)}}
async function loadQ(){const id=$('questionExam').value;if(!id){$('questions').innerHTML='<p class="note">Create/select an exam first.</p>';return}try{const a=await jf('/api/admin/questions?examId='+encodeURIComponent(id));$('questions').innerHTML='<p>Total Questions: <b>'+a.length+'</b></p><table><tr><th>#</th><th>Excel Set</th><th>Question</th><th>A</th><th>B</th><th>C</th><th>D</th><th>Answer</th><th>Time</th></tr>'+a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.batchName||'Older / Existing')}</td><td>${esc(x.question)}</td><td>${esc(x.a)}</td><td>${esc(x.b)}</td><td>${esc(x.c)}</td><td>${esc(x.d)}</td><td>${esc(x.answer)}</td><td>${x.questionSeconds||'-'}</td></tr>`).join('')+'</table>'}catch(e){$('questions').innerHTML='<p class=bad>'+esc(e.message)+'</p>'}}
window.addEventListener('DOMContentLoaded',()=>{$('upload').onclick=uploadQuestions;$('clearQ').onclick=clearQuestions;$('showQ').onclick=loadQ;$('questionExam').onchange=()=>{const id=$('questionExam').value;$('uploadExam').value=id;loadQ();loadQuestionSets()};$('uploadExam').onchange=()=>{const id=$('uploadExam').value;$('questionExam').value=id;loadQuestionSets();loadQ()};loadQuestionExams().then(loadQuestionSets)});</script></body></html>
