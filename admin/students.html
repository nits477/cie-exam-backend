<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Students - CIE Admin</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#172033}header{background:#123b72;color:#fff;padding:16px 22px;position:sticky;top:0;z-index:20}.top{max-width:1220px;margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.brand h1{font-size:22px;margin:0}.brand small{opacity:.85}.nav{max-width:1220px;margin:0 auto;padding:10px 20px;background:#fff;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e4e9f1}.nav a{padding:9px 12px;border-radius:8px;text-decoration:none;color:#123b72;font-weight:bold}.nav a:hover,.nav a.active{background:#e8f0ff}main{max-width:1220px;margin:auto;padding:20px}.card{background:#fff;padding:20px;margin:18px 0;border-radius:12px;box-shadow:0 2px 10px #0000000d}button{background:#1769e0;color:#fff;border:0;padding:10px 14px;border-radius:7px;margin:4px 6px 4px 0;cursor:pointer}button.secondary{background:#506176}button.warn{background:#b54708}button.danger{background:#b42318}input,select{padding:8px;margin:4px 8px 4px 0;border:1px solid #ccd4df;border-radius:7px;box-sizing:border-box}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:14px}th{background:#f8fafc}.bad{color:#b42318}.ok{color:green}.note{font-size:13px;color:#586174}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f0ff;color:#123b72;font-weight:bold}.scroll{overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.tile{display:block;background:#fff;padding:22px;border-radius:14px;box-shadow:0 2px 10px #0001;text-decoration:none;color:#172033}.tile b{display:block;color:#123b72;font-size:18px;margin-bottom:7px}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:8px}.formgrid label{font-size:13px;font-weight:bold}.formgrid label span{display:block;margin-bottom:3px}.formgrid input,.formgrid select{width:100%;margin:0}.filters{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.filters label span{display:block;font-size:13px;font-weight:bold}@media(max-width:850px){.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.formgrid{grid-template-columns:1fr}.nav{overflow:auto;flex-wrap:nowrap}}</style></head><body><header><div class="top"><div class="brand"><h1>CIE Exam — Admin Portal V3.5.7</h1><small>Students</small></div><div><button id="changePasswordBtn" class="secondary">Change Password</button><button id="logoutBtn" class="danger">Logout</button></div></div></header><nav class="nav"><a class="" href="/admin">Dashboard</a><a class="" href="/admin/exams">Exams</a><a class="" href="/admin/results">Results</a><a class="active" href="/admin/students">Students</a><a class="" href="/admin/pin-reset">PIN Reset</a><a class="" href="/admin/promotions">Promotions</a><a class="" href="/admin/media">App & Thumbnails</a></nav><main><div class="card"><h2>Students</h2><button id="refresh">Refresh Students</button><div id="students" class="scroll"></div></div></main><script>const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){if(!v)return'';try{return new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return v}}async function jf(url,opt){const r=await fetch(url,opt),j=await r.json().catch(()=>({error:'Invalid server response'}));if(r.status===401){location.href='/admin';throw new Error('Admin session expired.')}if(!r.ok)throw new Error(j.error||'Request failed');return j}async function logout(){try{await jf('/api/admin/auth/logout',{method:'POST'})}catch{}location.href='/admin'}async function changePwd(){const oldPassword=prompt('Enter current Admin password:');if(oldPassword===null)return;const newPassword=prompt('Enter NEW password (minimum 8 characters):');if(newPassword===null)return;try{const j=await jf('/api/admin/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({oldPassword,newPassword})});alert(j.message||'Password changed.')}catch(e){alert(e.message)}}window.addEventListener('DOMContentLoaded',()=>{document.getElementById('logoutBtn')?.addEventListener('click',logout);document.getElementById('changePasswordBtn')?.addEventListener('click',changePwd)});async function load(){try{const a=await jf('/api/admin/students');$('students').innerHTML='<table><tr><th>Name</th><th>Father</th><th>Mobile</th><th>PIN</th><th>Action</th></tr>'+a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.fatherName)}</td><td>${esc(x.mobile)}</td><td>${x.pinSet?'Set':'Not Set'}</td><td><button onclick="resetPin(${x.id},'${esc(x.mobile)}')">Set/Reset PIN</button><button class="danger" onclick="delStudent(${x.id})">Delete Student</button></td></tr>`).join('')+'</table>'}catch(e){$('students').innerHTML='<p class=bad>'+esc(e.message)+'</p>'}}async function resetPin(studentId,mobile){const p=prompt('Enter NEW 4-digit PIN for '+mobile);if(p===null)return;if(!/^\d{4}$/.test(p))return alert('PIN exactly 4 digits होना चाहिए');try{const j=await jf('/api/admin/reset-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({studentId,mobile,newPin:p})});alert(j.message);load()}catch(e){alert(e.message)}}async function delStudent(id){if(!confirm('Student aur uska linked data permanently delete karna hai?'))return;try{await jf('/api/admin/students/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}window.addEventListener('DOMContentLoaded',()=>{$('refresh').onclick=load;load()});</script></body></html>
