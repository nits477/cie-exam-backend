<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIN Reset - CIE Admin</title><style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f4f7fb;margin:0;color:#172033}main{max-width:1220px;margin:auto;padding:20px}.card{background:#fff;padding:22px;border-radius:15px;box-shadow:0 5px 20px #12365b12}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.note{font-size:13px;color:#586174}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:13px}th,td{padding:11px 9px;border-bottom:1px solid #dde5ef;text-align:left;font-size:14px}th{background:#f3f7fc}button{background:#1769e0;color:#fff;border:0;padding:10px 14px;border-radius:8px;margin:3px;cursor:pointer;font-weight:700}.danger{background:#b42318}.bad{color:#b42318}.empty{text-align:center;padding:30px;color:#69778c}@media(max-width:650px){main{padding:10px}th,td{white-space:nowrap}}
</style></head><body><main><div class="card"><div class="toolbar"><div><h2>PIN Reset Requests</h2><p class="note">Pending और Resolved—दोनों requests को delete किया जा सकता है। Delete database से permanent होगा.</p></div><button id="refresh">Refresh Requests</button></div><div id="requests" class="scroll"></div></div></main><script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(v){if(!v)return'';try{return new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return v}}async function jf(url,opt){const r=await fetch(url,opt),j=await r.json().catch(()=>({error:'Invalid server response'}));if(r.status===401){location.href='/admin';throw Error('Admin session expired.')}if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){try{const a=await jf('/api/admin/pin-reset-requests');if(!a.length){$('requests').innerHTML='<div class="empty">No PIN reset requests.</div>';return}$('requests').innerHTML='<table><thead><tr><th>Requested</th><th>Name</th><th>Mobile</th><th>Status</th><th>Resolved</th><th>Action</th></tr></thead><tbody>'+a.map(x=>`<tr><td>${esc(fmt(x.requestedAt))}</td><td>${esc(x.name||'')}</td><td>${esc(x.mobile)}</td><td>${esc(x.status)}</td><td>${esc(fmt(x.resolvedAt))}</td><td>${x.status==='PENDING'?`<button onclick="resetPin(${x.id},${x.studentId||'null'},'${esc(x.mobile)}')">Reset PIN</button>`:''}<button class="danger" onclick="delReq(${x.id},'${esc(x.status)}')">Delete</button></td></tr>`).join('')+'</tbody></table>'}catch(e){$('requests').innerHTML='<p class="bad">'+esc(e.message)+'</p>'}}
async function resetPin(requestId,studentId,mobile){const p=prompt('Enter NEW 4-digit PIN for '+mobile);if(p===null)return;if(!/^\d{4}$/.test(p))return alert('PIN exactly 4 digits होना चाहिए');try{const j=await jf('/api/admin/reset-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requestId,studentId,mobile,newPin:p})});alert(j.message);load()}catch(e){alert(e.message)}}
async function delReq(id,status){if(!confirm(status+' PIN reset request को permanently delete करना है?'))return;try{await jf('/api/admin/pin-reset-requests/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}
$('refresh').onclick=load;load();
</script></body></html>
