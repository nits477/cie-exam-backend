<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Popups - CIE Admin</title><style>body{font-family:Arial;background:#f4f7fb;color:#172033;margin:0}main{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;padding:22px;margin:16px 0;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:700}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd6e3;border-radius:8px;margin-top:5px}textarea{min-height:110px}button{border:0;border-radius:8px;padding:10px 14px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer;margin:5px}.danger{background:#b42318}.secondary{background:#596579}.note{background:#edf5ff;padding:10px;border-radius:8px}.preview{max-width:180px;max-height:120px;border-radius:8px}.item{border:1px solid #dce4ef;border-radius:10px;padding:13px;margin-top:10px}.ok{color:#087b4d}.bad{color:#b42318}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="card"><h1>Student Login Popups</h1><p>Active popup सफल Mobile + PIN login के तुरंत बाद app में दिखेगा। सभी popups की list इसी page पर रहेगी।</p><input type="hidden" id="editId"><div class="grid"><label>Title<input id="title" maxlength="100"></label><label>Button Text<input id="buttonText" maxlength="40" value="View Details"></label></div><label>Message<textarea id="message" maxlength="1500"></textarea></label><div class="grid"><label>Button Link<input id="buttonUrl" maxlength="500" placeholder="https://..."></label><label style="padding-top:25px"><input id="active" type="checkbox" style="width:auto"> Active</label></div><div class="note"><b>Image size:</b> 1200 × 800 px recommended; JPG/PNG/WebP; maximum 2 MB.</div><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><div><button id="save">Create Popup</button><button class="secondary" id="clear">Clear</button></div><p id="msg"></p></section><section class="card"><h2>Saved Popups</h2><div id="list">Loading...</div></section></main><script>const $=x=>document.getElementById(x);let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o){const r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function reset(){editId.value='';title.value='';message.value='';buttonText.value='View Details';buttonUrl.value='';active.checked=false;image.value='';save.textContent='Create Popup'}async function load(){try{rows=await api('/api/admin/student-popups');list.innerHTML=rows.length?rows.map(x=>`<div class="item"><b>${esc(x.title)}</b> • ${x.active?'<span class="ok">ACTIVE</span>':'Inactive'}<p>${esc(x.message)}</p>${x.hasImage?`<img class="preview" src="/api/student-popup/${x.id}/image?${Date.now()}">`:''}<div><button onclick="edit(${x.id})">Edit</button><button class="danger" onclick="del(${x.id})">Delete</button>${x.hasImage?`<button class="secondary" onclick="removeImage(${x.id})">Remove Image</button>`:''}</div></div>`).join(''):'<p>No popup created yet.</p>'}catch(e){list.innerHTML='<p class=bad>'+esc(e.message)+'</p>'}}function edit(id){const x=rows.find(v=>v.id==id);editId.value=id;title.value=x.title||'';message.value=x.message||'';buttonText.value=x.buttonText||'';buttonUrl.value=x.buttonUrl||'';active.checked=!!x.active;save.textContent='Update Popup';scrollTo({top:0,behavior:'smooth'})}async function store(){try{const id=editId.value,b={title:title.value,message:message.value,buttonText:buttonText.value,buttonUrl:buttonUrl.value,active:active.checked};const j=await api(id?'/api/admin/student-popups/'+id:'/api/admin/student-popups',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const target=id||j.id,f=image.files[0];if(f){if(f.size>2097152)throw Error('Image must be 2 MB or smaller.');const fd=new FormData();fd.append('image',f);await api('/api/admin/student-popups/'+target+'/image',{method:'POST',body:fd})}msg.className='ok';msg.textContent='Popup saved successfully.';reset();load()}catch(e){msg.className='bad';msg.textContent=e.message}}async function del(id){if(!confirm('Delete this popup?'))return;await api('/api/admin/student-popups/'+id,{method:'DELETE'});load()}async function removeImage(id){await api('/api/admin/student-popups/'+id+'/image',{method:'DELETE'});load()}save.onclick=store;clear.onclick=reset;load();</script></body></html>
