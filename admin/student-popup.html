<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login Popup - CIE</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#14223a;font-family:Segoe UI,Arial,sans-serif}.top{background:#0b3f79;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff}.card{max-width:820px;margin:28px auto;background:#fff;border-radius:18px;padding:25px;box-shadow:0 10px 35px #12365b18}label{display:block;font-weight:700;margin:15px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #cad6e4;border-radius:10px;font:inherit}textarea{min-height:120px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.note{background:#edf5ff;border:1px solid #c9def5;padding:12px;border-radius:10px;font-size:13px;margin:10px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:10px;padding:12px 17px;background:#0b63ce;color:#fff;font-weight:800;cursor:pointer}.danger{background:#bd2a20}.preview{display:none;max-width:100%;max-height:320px;border-radius:12px;margin-top:12px;border:1px solid #d5e0ec}.msg{margin-top:14px;font-weight:700}.ok{color:#087b4d}.err{color:#b42318}@media(max-width:650px){.row{grid-template-columns:1fr}.card{margin:12px}}</style></head><body><header class="top"><b>CIE Admin • Student Login Popup</b><a href="/admin">← Dashboard</a></header><main class="card"><h1>Student Login Popup</h1><p>यह popup छात्र के सही Mobile + PIN से login करने के तुरंत बाद app में दिखाई देगा।</p><label>Popup Title<input id="title" maxlength="100" placeholder="Important Notice"></label><label>Message<textarea id="message" maxlength="1500" placeholder="Popup message..."></textarea></label><div class="row"><label>Button Text<input id="buttonText" maxlength="40" placeholder="View Details"></label><label>Button Link (optional)<input id="buttonUrl" maxlength="500" placeholder="https://..."></label></div><label><input id="active" type="checkbox" style="width:auto"> Popup Active</label><div class="note"><b>Popup image:</b> recommended size <b>1200 × 800 px</b>. JPG, PNG or WebP only; maximum 2 MB.</div><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" class="preview" alt="Popup preview"><div class="actions"><button onclick="save()">Save Popup</button><button onclick="uploadImage()">Upload Image</button><button class="danger" onclick="removeImage()">Remove Image</button></div><div id="msg" class="msg"></div></main><script>const $=id=>document.getElementById(id);function say(t,ok=true){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}async function api(url,opt){const r=await fetch(url,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){try{const j=await api('/api/admin/student-popup');$('title').value=j.title||'Important Notice';$('message').value=j.message||'';$('buttonText').value=j.buttonText||'View Details';$('buttonUrl').value=j.buttonUrl||'';$('active').checked=!!j.active;if(j.hasImage){$('preview').src='/api/student-popup/image?'+Date.now();$('preview').style.display='block'}}catch(e){say(e.message,false)}}async function save(){try{await api('/api/admin/student-popup',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('title').value,message:$('message').value,buttonText:$('buttonText').value,buttonUrl:$('buttonUrl').value,active:$('active').checked})});say('Popup saved successfully.')}catch(e){say(e.message,false)}}async function uploadImage(){const f=$('image').files[0];if(!f)return say('Please select an image.',false);if(f.size>2*1024*1024)return say('Image must be 2 MB or smaller.',false);const fd=new FormData();fd.append('image',f);try{await api('/api/admin/student-popup/image',{method:'POST',body:fd});$('preview').src='/api/student-popup/image?'+Date.now();$('preview').style.display='block';say('Image uploaded successfully.')}catch(e){say(e.message,false)}}async function removeImage(){try{await api('/api/admin/student-popup/image',{method:'DELETE'});$('preview').style.display='none';$('preview').removeAttribute('src');say('Image removed.')}catch(e){say(e.message,false)}}$('image').onchange=()=>{const f=$('image').files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').style.display='block'}};load();</script></body></html>
