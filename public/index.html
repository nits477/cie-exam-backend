<!doctype html><html><head><meta charset="utf-8"><title>CIE Exam Admin</title><style>body{font-family:Arial;background:#f4f7fb;margin:0}header{background:#123b72;color:#fff;padding:22px}main{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;padding:20px;margin:18px 0;border-radius:12px}button{background:#1769e0;color:white;border:0;padding:10px 14px;border-radius:7px;margin-right:6px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}.bad{color:#b42318}.ok{color:green}</style></head><body><header><h1>CIE Exam — Admin Portal</h1><div>Question Excel Upload • Question Bank • Results</div></header><main><div class=card><h2>Upload Questions Excel</h2><p>Question | Option A | Option B | Option C | Option D | Answer</p><input id=f type=file accept=".xlsx,.xls"><button onclick=up()>Upload & Import</button><button onclick=clr()>Clear Question Bank</button><div id=m></div></div><div class=card><h2>Question Bank</h2><button onclick=lq()>Refresh</button><div id=q></div></div><div class=card><h2>Results</h2><button onclick=lr()>Refresh</button><button onclick=csv()>Download Results</button><button onclick=dedupe()>Remove Duplicate Results</button><div id=r></div></div></main><script>
async function up(){let f=document.getElementById('f').files[0];if(!f)return alert('Select Excel');let d=new FormData();d.append('file',f);let x=await fetch('/api/admin/upload-excel',{method:'POST',body:d}),j=await x.json();document.getElementById('m').innerHTML=x.ok?`<p class=ok>Found: ${j.found} | Imported: ${j.imported}</p>${j.errors.length?'<pre class=bad>'+j.errors.join('\n')+'</pre>':''}`:`<p class=bad>${j.error}</p>`;lq()}
async function clr(){await fetch('/api/admin/clear-questions',{method:'POST'});lq()}
async function lq(){let a=await(await fetch('/api/questions')).json();document.getElementById('q').innerHTML='<p>Total: <b>'+a.length+'</b></p><table><tr><th>#</th><th>Question</th><th>A</th><th>B</th><th>C</th><th>D</th></tr>'+a.map((x,i)=>`<tr><td>${i+1}</td><td>${x.question}</td><td>${x.a}</td><td>${x.b}</td><td>${x.c}</td><td>${x.d}</td></tr>`).join('')+'</table>'}
async function lr(){let a=await(await fetch('/api/results')).json();document.getElementById('r').innerHTML='<table><tr><th>Name</th><th>Father Name</th><th>Mobile</th><th>Score</th><th>%</th><th>Status</th></tr>'+a.map(x=>`<tr><td>${x.name}</td><td>${x.fatherName}</td><td>${x.mobile}</td><td>${x.score}/${x.total}</td><td>${x.percentage}</td><td>${x.status}</td></tr>`).join('')+'</table>'}
async function dedupe(){if(!confirm('Duplicate result rows हटानी हैं?'))return;let x=await fetch('/api/admin/remove-duplicate-results',{method:'POST'}),j=await x.json();alert(`Removed: ${j.removed}`);lr()}
async function csv(){let a=await(await fetch('/api/results')).json(),rows=[['Name','Father Name','Mobile','Score','Total','Percentage','Status','Date'],...a.map(x=>[x.name,x.fatherName,x.mobile,x.score,x.total,x.percentage,x.status,x.createdAt])],s=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n'),e=document.createElement('a');e.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));e.download='CIE_Results.csv';e.click()}lq();lr();</script></body></html>
